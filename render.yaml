services:
  - type: keyvalue
    name: evalpulse-queue
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

  - type: web
    name: evalpulse-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    dockerCommand: sh services/api/start-render.sh
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: evalpulse-queue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: LLM_ENABLED
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: evalpulse-web
    runtime: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: API_INTERNAL_URL
        value: https://evalpulse-api.onrender.com
