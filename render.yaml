databases:
  - name: evalpulse-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    databaseName: evalpulse
    user: evalpulse
    ipAllowList: []

services:
  - type: keyvalue
    name: evalpulse-queue
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

  - type: web
    name: evalpulse-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    dockerCommand: sh services/api/start-render.sh
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evalpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: evalpulse-queue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""

  - type: web
    name: evalpulse-web
    runtime: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: API_INTERNAL_URL
        value: https://evalpulse-api.onrender.com
