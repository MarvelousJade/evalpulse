name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy python/evalpulse
      - run: pytest --cov=evalpulse --cov-report=term-missing

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspace @evalpulse/api-client
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: evalpulse_test
          POSTGRES_USER: evalpulse
          POSTGRES_PASSWORD: evalpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalpulse -d evalpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://evalpulse:evalpulse@localhost:5432/evalpulse_test
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: integration-secret-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest tests/integration

  compose-e2e:
    runs-on: ubuntu-latest
    needs: [python-check, web-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:install --workspace @evalpulse/e2e
      - run: docker compose up --build --detach --wait
      - run: npm test --workspace @evalpulse/e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  container-build:
    runs-on: ubuntu-latest
    needs: [python-check, web-check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t evalpulse-api:${{ github.sha }} .
      - run: docker build -f services/worker/Dockerfile -t evalpulse-worker:${{ github.sha }} .
      - run: docker build -f apps/web/Dockerfile -t evalpulse-web:${{ github.sha }} .

  kubernetes-smoke:
    runs-on: ubuntu-latest
    needs: [container-build, postgres-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: evalpulse-ci
      - run: docker build -f services/api/Dockerfile -t evalpulse-api:local .
      - run: docker build -f services/worker/Dockerfile -t evalpulse-worker:local .
      - run: docker build -f apps/web/Dockerfile -t evalpulse-web:local .
      - run: kind load docker-image --name evalpulse-ci evalpulse-api:local evalpulse-worker:local evalpulse-web:local
      - run: kubectl apply -k infra/k8s/overlays/kind
      - run: kubectl wait --for=condition=complete job/migrate -n evalpulse --timeout=180s
      - run: kubectl rollout restart deployment/api deployment/web -n evalpulse
      - run: kubectl wait --for=condition=available deployment/api deployment/web deployment/worker -n evalpulse --timeout=180s
      - run: kubectl port-forward -n evalpulse service/api 8000:8000 > /tmp/evalpulse-port-forward.log 2>&1 &
      - run: |
          for attempt in $(seq 1 30); do
            curl --fail http://localhost:8000/health/ready && break
            sleep 2
          done
      - run: python scripts/smoke.py http://localhost:8000
      - if: failure()
        run: kubectl get all -n evalpulse && kubectl logs -n evalpulse -l app.kubernetes.io/name=evalpulse --all-containers --tail=200

