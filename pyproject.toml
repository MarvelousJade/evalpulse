[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evalpulse"
version = "0.1.0"
description = "Deterministic prompt evaluation and regression testing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.25,<5",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/evalpulse"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
pythonpath = ["python", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["evalpulse"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
